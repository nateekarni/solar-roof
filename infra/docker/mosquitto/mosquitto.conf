persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/auth/acl
# Internal Docker network only. Not published on the host.
listener 1883
# Public gateway endpoint: mqtt-solar.fowir.com:8883.
listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
