# Standalone MQTT broker resource with host-managed TLS certificates.
# Use this when DNS is not hosted on Cloudflare or certificates are managed externally/on host.
# API in the web resource connects through mqtts://mqtt-solar.fowir.com:8883.
services:
  mqtt:
    # Pilot defaults for the existing 2 vCPU / 4 GiB host; verify peak usage.
    cpus: ${MQTT_CPU_LIMIT:-0.25}
    mem_limit: ${MQTT_MEMORY_LIMIT:-128m}
    mem_reservation: ${MQTT_MEMORY_RESERVATION:-32m}
    image: ${MQTT_IMAGE:?immutable managed MQTT image required}
    restart: unless-stopped
    ports: ['8883:8883']
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?backend MQTT password required}
      MQTT_GATEWAY_CREDENTIALS: ${MQTT_GATEWAY_CREDENTIALS:?Gateway credentials JSON required}
      MQTT_TLS_DOMAIN: ${MQTT_TLS_DOMAIN:-mqtt-solar.fowir.com}
    volumes:
      - ${MQTT_CERTS_DIR:-/data/mqtt-certs}:/mosquitto/certs/current:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: [CMD, python3, /usr/local/bin/mqtt-runtime.py, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  mqtt-data:
