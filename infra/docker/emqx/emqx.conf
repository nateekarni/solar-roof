# EMQX 5.8.3 baseline. Authentication and authorization sources are injected
# by docker-compose.emqx.yml because their shared callback secret is required.

node {
  name = "emqx@127.0.0.1"
}

# Public gateway listener. Gateways authenticate with the HTTP authenticator;
# client certificates are optional, but every client must validate this server.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 102400
  ssl_options {
    cacertfile = "/opt/emqx/certs/server/fullchain.pem"
    certfile = "/opt/emqx/certs/server/fullchain.pem"
    keyfile = "/opt/emqx/certs/server/privkey.pem"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

# Backend-only listener. Compose exposes this port to the private network but
# never publishes it on the host. MQTT authentication still applies.
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 102400
}

dashboard.listeners.http.bind = 0
dashboard.listeners.https {
  bind = "0.0.0.0:18083"
  ssl_options {
    cacertfile = "/opt/emqx/certs/server/fullchain.pem"
    certfile = "/opt/emqx/certs/server/fullchain.pem"
    keyfile = "/opt/emqx/certs/server/privkey.pem"
  }
}

authorization {
  no_match = "deny"
  deny_action = "ignore"
}

# Preserve the broker-authenticated publisher Client ID across the backend MQTT
# boundary. Public clients cannot publish to this internal topic through ACL.
rule_engine.rules.telemetry_ingress {
  enable = true
  sql = "SELECT clientid, topic, payload FROM \"solar/v1/sites/+/gateways/+/devices/+/telemetry\""
  actions = [{
    function = republish
    args {
      topic = "$solar/internal/telemetry/${clientid}/${topic}"
      payload = "${payload}"
      qos = 1
      retain = false
      direct_dispatch = true
      mqtt_properties = {}
      user_properties = ""
    }
  }]
}
