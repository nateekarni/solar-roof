# EMQX v5 Production Configuration for Solar Platform

node {
  name = "emqx@127.0.0.1"
  cookie = "solar_emqx_secret_cookie"
}

# 1. TLS Listener for Public Gateway Devices (MQTTS 8883)
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  max_connections = 102400
  ssl_options {
    cacertfile = "/opt/emqx/certs/fullchain.pem"
    certfile = "/opt/emqx/certs/fullchain.pem"
    keyfile = "/opt/emqx/certs/privkey.pem"
    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

# 2. Plain TCP Listener for Backend API (Internal Network 1883)
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 102400
}

# 3. Dynamic HTTP Authentication (Calls Solar Backend API)
authentication = [
  {
    mechanism = "password_based"
    backend = "http"
    enable = true
    method = "post"
    url = "https://solar.fowir.com/v1/internal/mqtt/auth"
    headers {
      "content-type" = "application/json"
      "origin" = "https://solar.fowir.com"
    }
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
      peerhost = "${peerhost}"
    }
    pool_size = 8
    connect_timeout = "5s"
    request_timeout = "5s"
  }
]

# 4. Dynamic HTTP Authorization / ACL
authorization {
  no_match = "deny"
  deny_action = "ignore"
  sources = [
    {
      type = "http"
      enable = true
      method = "post"
      url = "https://solar.fowir.com/v1/internal/mqtt/acl"
      headers {
        "content-type" = "application/json"
        "origin" = "https://solar.fowir.com"
      }
      body {
        username = "${username}"
        clientid = "${clientid}"
        action = "${action}"
        topic = "${topic}"
      }
      pool_size = 8
      connect_timeout = "5s"
      request_timeout = "5s"
    }
  ]
}
