services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar_platform}
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations/001_core.sql:/docker-entrypoint-initdb.d/002-core.sql:ro
      - ../migrations/002_platform_data.sql:/docker-entrypoint-initdb.d/003-platform-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
  mqtt:
    image: emqx/emqx:5.8.5
    ports: ["${MQTT_PORT:-1883}:1883", "${MQTT_WS_PORT:-8083}:8083", "${MQTT_DASHBOARD_PORT:-18083}:18083"]
    healthcheck:
      test: ["CMD-SHELL", "emqx ctl status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
  storage:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: ["${STORAGE_PORT:-9000}:9000", "${STORAGE_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  redis-data:
  minio-data:
