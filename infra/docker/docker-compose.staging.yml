# Coolify attaches its reverse proxy to web:3000. Only TLS MQTT is host-published.
# Set app images to immutable ghcr.io/...@sha256:... references from CI.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?immutable tested postgres-backup image required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar_platform}
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      PGBACKREST_REPO1_S3_ENDPOINT: ${PGBACKREST_REPO1_S3_ENDPOINT:-}
      PGBACKREST_REPO1_S3_BUCKET: ${PGBACKREST_REPO1_S3_BUCKET:-}
      PGBACKREST_REPO1_S3_REGION: ${PGBACKREST_REPO1_S3_REGION:-}
      PGBACKREST_REPO1_S3_KEY: ${PGBACKREST_REPO1_S3_KEY:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${PGBACKREST_REPO1_S3_KEY_SECRET:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_REPO1_CIPHER_PASS:-}
      PGBACKREST_REPO1_PATH: ${PGBACKREST_REPO1_PATH:-/solar}
    volumes: [postgres-data:/var/lib/postgresql/data, solar-backup-status:/var/lib/solar-backup]
    healthcheck:
      test: [CMD, /opt/solar-backup/entrypoint.sh, health]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
  certbot:
    image: ${CERTBOT_IMAGE:?immutable certificate service image required}
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Cloudflare DNS token required}
      ACME_EMAIL: ${ACME_EMAIL:?certificate contact email required}
      MQTT_TLS_DOMAIN: mqtt-solar.fowir.com
    volumes:
      - letsencrypt-data:/etc/letsencrypt
      - mqtt-certs:/export
    healthcheck:
      test: [CMD, python3, /opt/solar-certbot/service.py, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
  mqtt:
    image: ${MQTT_IMAGE:?immutable managed MQTT image required}
    restart: unless-stopped
    ports: ['8883:8883']
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?backend MQTT password required}
      MQTT_GATEWAY_CREDENTIALS: ${MQTT_GATEWAY_CREDENTIALS:?Gateway credentials JSON required}
      MQTT_TLS_DOMAIN: mqtt-solar.fowir.com
    volumes:
      - mqtt-certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
    depends_on:
      certbot: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, /usr/local/bin/mqtt-runtime.py, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  storage:
    image: ${STORAGE_IMAGE:-ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9}
    restart: unless-stopped
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-solar}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 12
  storage-init:
    image: ${API_IMAGE:?immutable API image required}
    restart: 'no'
    environment:
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-solar}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-solar-platform}
    working_dir: /app/apps/api
    command:
      - node
      - --input-type=module
      - -e
      - >-
        import {S3Client, CreateBucketCommand, HeadBucketCommand} from '@aws-sdk/client-s3';
        const client = new S3Client({endpoint:'http://storage:9000',region:'us-east-1',forcePathStyle:true,credentials:{accessKeyId:process.env.STORAGE_ACCESS_KEY,secretAccessKey:process.env.STORAGE_SECRET_KEY}});
        const Bucket = process.env.STORAGE_BUCKET;
        try { await client.send(new HeadBucketCommand({Bucket})); }
        catch (error) { if (error.$$metadata?.httpStatusCode !== 404) throw error; await client.send(new CreateBucketCommand({Bucket})); }
    depends_on:
      storage: {condition: service_healthy}
  migrate:
    image: ${API_IMAGE:?immutable API image required}
    restart: 'no'
    command: [pnpm, --filter, '@solar/api', 'db:migrate']
    environment:
      DATABASE_URL: ${DATABASE_URL:?URL-encoded PostgreSQL connection URL required}
    depends_on:
      postgres: {condition: service_healthy}
  bootstrap:
    image: ${API_IMAGE:?immutable API image required}
    restart: 'no'
    command: [pnpm, --filter, '@solar/api', 'db:bootstrap']
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?initial administrator email required}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?initial administrator password required}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-solar-platform}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-solar}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
  release-evidence:
    image: ${API_IMAGE:?immutable API image required}
    network_mode: none
    restart: 'no'
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    working_dir: /app
    command: [node, scripts/ci/install-release-evidence.mjs]
    environment:
      PLATFORM_RELEASE_EVIDENCE_JSON: ${PLATFORM_RELEASE_EVIDENCE_JSON:-}
    volumes: [solar-release-evidence:/var/lib/solar-release]
  api:
    image: ${API_IMAGE:?immutable API image required}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      API_PORT: 3001
      WEB_URL: https://solar.fowir.com
      # Empty trust is safe; enabling the direct edge route requires runtime evidence.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      API_EDGE_ENABLED: ${API_EDGE_ENABLED:-false}
      ENERGY_READ_MODEL_ENABLED: ${ENERGY_READ_MODEL_ENABLED:-false}
      HISTORY_RESTORE_ENABLED: ${HISTORY_RESTORE_ENABLED:-false}
      HISTORY_RESTORE_MAX_DAYS: ${HISTORY_RESTORE_MAX_DAYS:-31}
      PLATFORM_MONITORING_ENABLED: ${PLATFORM_MONITORING_ENABLED:-false}
      PLATFORM_BACKUP_STATUS_FILE: /var/lib/solar-backup/status.json
      PLATFORM_MONITORING_WEBHOOK_URL: ${PLATFORM_MONITORING_WEBHOOK_URL:-}
      PLATFORM_MONITORING_WEBHOOK_TOKEN: ${PLATFORM_MONITORING_WEBHOOK_TOKEN:-}
      PLATFORM_MONITORING_RECEIVER_VERIFIED: ${PLATFORM_MONITORING_RECEIVER_VERIFIED:-false}
      PLATFORM_WAL_LAG_SECONDS: ${PLATFORM_WAL_LAG_SECONDS:-600}
      PLATFORM_BACKUP_AGE_SECONDS: ${PLATFORM_BACKUP_AGE_SECONDS:-93600}
      PLATFORM_DISK_PERCENT: ${PLATFORM_DISK_PERCENT:-80}
      PLATFORM_RELEASE_REVISION: ${PLATFORM_RELEASE_REVISION:-}
      PLATFORM_IMAGE_DIGESTS_JSON: ${PLATFORM_IMAGE_DIGESTS_JSON:-}
      PLATFORM_RELEASE_EVIDENCE_FILE: /var/lib/solar-release/evidence.json
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: redis://redis:6379
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: solar-backend
      MQTT_PASSWORD: ${MQTT_PASSWORD:?required}
      MQTT_MAX_PAYLOAD_BYTES: ${MQTT_MAX_PAYLOAD_BYTES:-131072}
      MQTT_MAX_JSON_DEPTH: ${MQTT_MAX_JSON_DEPTH:-16}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-8}
      INGEST_QUEUE_LIMIT: ${INGEST_QUEUE_LIMIT:-1024}
      INGEST_QUEUE_BYTES: ${INGEST_QUEUE_BYTES:-16777216}
      INGEST_PER_GATEWAY_RATE: ${INGEST_PER_GATEWAY_RATE:-50}
      INGEST_PER_GATEWAY_BURST: ${INGEST_PER_GATEWAY_BURST:-100}
      INGEST_SHUTDOWN_TIMEOUT_MS: ${INGEST_SHUTDOWN_TIMEOUT_MS:-10000}
      API_READ_POOL_MAX: ${API_READ_POOL_MAX:-12}
      INGEST_DB_POOL_MAX: ${INGEST_DB_POOL_MAX:-8}
      API_READ_STATEMENT_TIMEOUT_MS: ${API_READ_STATEMENT_TIMEOUT_MS:-1500}
      INGEST_DB_STATEMENT_TIMEOUT_MS: ${INGEST_DB_STATEMENT_TIMEOUT_MS:-5000}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-solar-platform}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-solar}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
    volumes:
      - solar-backup-status:/var/lib/solar-backup:ro
      - solar-release-evidence:/var/lib/solar-release:ro
    labels:
      traefik.enable: ${API_EDGE_ENABLED:-false}
      traefik.docker.network: ${COOLIFY_PROXY_NETWORK:-coolify}
      traefik.http.routers.solar-api.rule: Host(`solar.fowir.com`) && (Path(`/v1`) || PathPrefix(`/v1/`))
      traefik.http.routers.solar-api.priority: '100'
      traefik.http.routers.solar-api.entrypoints: ${COOLIFY_HTTPS_ENTRYPOINT:-https}
      traefik.http.routers.solar-api.tls: 'true'
      traefik.http.routers.solar-api.tls.certresolver: ${COOLIFY_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.solar-api.service: solar-api
      traefik.http.services.solar-api.loadbalancer.server.port: '3001'
    depends_on:
      release-evidence: {condition: service_completed_successfully}
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mqtt: {condition: service_healthy}
      bootstrap: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  worker:
    image: ${WORKER_IMAGE:?immutable worker image required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      WORKER_PORT: 3002
      ENERGY_SUMMARY_WORKER_ENABLED: ${ENERGY_SUMMARY_WORKER_ENABLED:-false}
      REPORT_WORKER_ENABLED: ${REPORT_WORKER_ENABLED:-false}
      HISTORY_RESTORE_WORKER_ENABLED: ${HISTORY_RESTORE_WORKER_ENABLED:-false}
      TELEMETRY_ARCHIVE_ENABLED: ${TELEMETRY_ARCHIVE_ENABLED:-false}
      TELEMETRY_ARCHIVE_SCHEDULER_ENABLED: ${TELEMETRY_ARCHIVE_SCHEDULER_ENABLED:-false}
      RAW_RETENTION_ENABLED: ${RAW_RETENTION_ENABLED:-false}
      HISTORY_RESTORE_MAX_DAYS: ${HISTORY_RESTORE_MAX_DAYS:-31}
      HISTORY_RESTORE_MAX_ROWS: ${HISTORY_RESTORE_MAX_ROWS:-1000000}
      HISTORY_RESTORE_MAX_MANIFESTS: ${HISTORY_RESTORE_MAX_MANIFESTS:-1000}
      HISTORY_RESTORE_MAX_COMPRESSED_BYTES: ${HISTORY_RESTORE_MAX_COMPRESSED_BYTES:-536870912}
      HISTORY_RESTORE_MAX_UNCOMPRESSED_BYTES: ${HISTORY_RESTORE_MAX_UNCOMPRESSED_BYTES:-2147483648}
      HISTORY_RESTORE_TIMEOUT_MS: ${HISTORY_RESTORE_TIMEOUT_MS:-600000}
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-solar-platform}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-solar}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: {condition: service_completed_successfully}
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    image: ${WEB_IMAGE:?immutable web image required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    expose: ['3000']
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  solar-backup-status:
  solar-release-evidence:
  postgres-data:
  redis-data:
  minio-data:
  mqtt-data:
  mqtt-certs:
  letsencrypt-data:
