x-backup-env: &backup-env
  POSTGRES_DB: solar_readiness
  POSTGRES_USER: solar
  POSTGRES_PASSWORD: ci-only-password
  BACKUP_ENABLED: 'true'
  PGBACKREST_REPO1_S3_BUCKET: solar-backups
  PGBACKREST_REPO1_S3_ENDPOINT: repository-proxy
  PGBACKREST_REPO1_STORAGE_PORT: '9443'
  PGBACKREST_REPO1_STORAGE_VERIFY_TLS: 'n'
  PGBACKREST_REPO1_S3_REGION: us-east-1
  PGBACKREST_REPO1_S3_KEY: solar-ci
  PGBACKREST_REPO1_S3_KEY_SECRET: ci-storage-only-password
  PGBACKREST_REPO1_CIPHER_PASS: ci-only-backup-encryption-never-production
  PGBACKREST_REPO1_PATH: /recovery-fixture
services:
  recovery-cert-init:
    image: ${RECOVERY_IMAGE:-solar-postgres-backup:ci}
    entrypoint: [openssl]
    command: [req, -x509, -newkey, 'rsa:2048', -nodes, -keyout, /certs/key.pem, -out, /certs/cert.pem, -days, '2', -subj, /CN=repository-proxy]
    volumes: [recovery-certs:/certs]
  repository-proxy:
    image: node:24.20.0-bookworm-slim
    command: [node, /fixture/proxy.mjs]
    volumes: ['./recovery-repository-proxy.mjs:/fixture/proxy.mjs:ro', 'recovery-certs:/certs:ro']
    depends_on:
      recovery-cert-init: {condition: service_completed_successfully}
      storage: {condition: service_healthy}
  postgres:
    image: ${RECOVERY_IMAGE:-solar-postgres-backup:ci}
    environment: *backup-env
    volumes: [recovery-source:/var/lib/postgresql/data, recovery-status:/var/lib/solar-backup]
    depends_on:
      storage: {condition: service_healthy}
      repository-proxy: {condition: service_started}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U solar -d solar_readiness']
      interval: 2s
      retries: 60
  restore-db:
    image: ${RECOVERY_IMAGE:-solar-postgres-backup:ci}
    profiles: [restore]
    environment:
      <<: *backup-env
      RESTORE_TARGET_TIME: ${RESTORE_TARGET_TIME:-}
      RESTORE_BACKUP_ID: ${RESTORE_BACKUP_ID:-}
    depends_on: {repository-proxy: {condition: service_started}}
    volumes: [recovery-restored:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(psql -U solar -d solar_readiness -Atc "SELECT pg_is_in_recovery()")" = f']
      interval: 2s
      retries: 45
  restore-negative:
    image: ${RECOVERY_IMAGE:-solar-postgres-backup:ci}
    profiles: [negative]
    environment:
      <<: *backup-env
      RESTORE_TARGET_TIME: ${RESTORE_TARGET_TIME:-}
      RESTORE_BACKUP_ID: ${RESTORE_BACKUP_ID:-}
    depends_on: {repository-proxy: {condition: service_started}}
    volumes: [recovery-negative:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(psql -U solar -d solar_readiness -Atc "SELECT pg_is_in_recovery()")" = f']
      interval: 2s
      retries: 15
  migrate:
    image: ${RECOVERY_API_IMAGE:-solar-api:ci}
  storage-init:
    image: ${RECOVERY_API_IMAGE:-solar-api:ci}
  fixture-user:
    image: ${RECOVERY_API_IMAGE:-solar-api:ci}
  worker:
    image: ${RECOVERY_WORKER_IMAGE:-solar-worker:ci}
  api:
    image: ${RECOVERY_API_IMAGE:-solar-api:ci}
    environment:
      DATABASE_URL: postgresql://solar:ci-only-password@${RECOVERY_DATABASE_HOST:-postgres}:5432/solar_readiness
      STORAGE_BUCKET: ${RECOVERY_STORAGE_BUCKET:-solar-readiness}
volumes:
  recovery-certs:
  recovery-source:
  recovery-restored:
  recovery-negative:
  recovery-status: