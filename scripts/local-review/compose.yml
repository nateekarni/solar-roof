name: solar-dashboard-review
services:
  postgres:
    image: timescale/timescaledb:2.18.2-pg16
    environment:
      POSTGRES_DB: solar_dashboard_review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: local-review-only
    ports: ['127.0.0.1:15439:5432']
    volumes: ['review-postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U review -d solar_dashboard_review']
      interval: 2s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:16379:6379']
  storage:
    image: aglowthai-minio-local-test:latest
    command: ['server','/data']
    environment:
      MINIO_ROOT_USER: localreview
      MINIO_ROOT_PASSWORD: local-review-storage-only
    ports: ['127.0.0.1:19009:9000']
    volumes: ['review-storage:/data']
volumes:
  review-postgres:
  review-storage:
