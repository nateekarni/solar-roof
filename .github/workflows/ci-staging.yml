name: Deep Verification
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'infra/ci/**'
      - 'infra/docker/Dockerfile.mqtt'
      - 'infra/docker/Dockerfile.certbot'
      - 'infra/docker/postgres-backup/**'
      - 'infra/docker/mosquitto/**'
      - 'infra/docker/docker-compose*.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'infra/ci/**'
      - 'infra/docker/Dockerfile.mqtt'
      - 'infra/docker/Dockerfile.certbot'
      - 'infra/docker/postgres-backup/**'
      - 'infra/docker/mosquitto/**'
      - 'infra/docker/docker-compose*.yml'
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Never terminate an active deployment/migration when a newer commit arrives.
concurrency:
  group: solar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-platform:
    name: Platform Regression, Smokes & Acceptance
    runs-on: ubuntu-24.04
    # A full run includes browser acceptance, platform regression, and publishing
    # six tested images. Keep headroom above the current ~26-minute runtime so
    # GitHub can finish post-job cleanup and expose digests to deployment.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.publish.outputs.api }}
      worker: ${{ steps.publish.outputs.worker }}
      web: ${{ steps.publish.outputs.web }}
      mqtt: ${{ steps.publish.outputs.mqtt }}
      certbot: ${{ steps.publish.outputs.certbot }}
      postgres-backup: ${{ steps.publish.outputs.postgres-backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' --recursive build
      - run: pnpm --filter @solar/web build
      - name: Build immutable candidate images
        id: build
        timeout-minutes: 10
        run: |
          node scripts/ci/phase-timing.mjs application-image-build bash -euo pipefail <<'BUILD'
          for app in api worker web mqtt certbot; do
            docker buildx build \
              --cache-from=type=gha,scope=$app \
              --cache-to=type=gha,mode=max,scope=$app \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -f "infra/docker/Dockerfile.$app" \
              -t "solar-$app:ci" \
              --load . &
          done
          docker buildx build \
            --cache-from=type=gha,scope=postgres-backup \
            --cache-to=type=gha,mode=max,scope=postgres-backup \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -f infra/docker/postgres-backup/Dockerfile \
            -t solar-postgres-backup:ci \
            --load . &
          wait
          BUILD
      - name: Validate artifact backup scheduler in the Linux runtime
        run: docker run --rm --entrypoint bash solar-api:ci -n /app/scripts/ci/recovery-artifacts-scheduler.sh
      - name: Test managed MQTT and certificate lifecycle without external credentials
        run: |
          docker run --rm --entrypoint python3 solar-mqtt:ci -m unittest discover -s /opt/solar-mqtt/tests
          docker run --rm --entrypoint python3 solar-certbot:ci -m unittest discover -s /opt/solar-certbot/tests
      - name: Verify managed MQTT TLS, credentials, ACLs and certificate reload
        run: bash infra/docker/mosquitto/managed-smoke.sh
      - name: Verify staging Compose with synthetic certificates
        run: bash infra/ci/managed-staging-smoke.sh
      - name: Verify web-first deployment without MQTT
        run: bash infra/ci/web-first-smoke.sh
      - name: Prepare version-matched browser server
        id: browser
        timeout-minutes: 5
        run: node scripts/ci/phase-timing.mjs browser-preparation bash scripts/ci/browser-server.sh start
      - name: Verify browser download transfer
        timeout-minutes: 2
        run: pnpm --filter @solar/web exec node test/platform/browser-download.mjs
      - name: Verify personal signature and staff position browser regressions
        timeout-minutes: 2
        run: pnpm --filter @solar/web exec node --test test/platform/own-signature.browser.test.mjs test/platform/staff-position.browser.test.mjs
      - name: Verify MQTT credentials and ACLs
        run: bash infra/docker/mosquitto/smoke.sh
      - name: Real integration and browser E2E in disposable stack
        if: ${{ !cancelled() && !failure() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        timeout-minutes: 8
        run: node scripts/ci/phase-timing.mjs integration bash scripts/ci/integration.sh
      - name: Isolated platform regression and latency baseline
        if: ${{ !cancelled() && !failure() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        timeout-minutes: 15
        run: node scripts/ci/phase-timing.mjs platform-regression bash scripts/ci/platform-check.sh all-fast --prebuilt
      - name: Capture browser server logs and remove owned container
        if: always()
        run: bash scripts/ci/browser-server.sh cleanup
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test/artifacts/compose.log
            test/artifacts/solar-ci-*.log
            test/artifacts/platform-baseline.json
            test/artifacts/managed-staging.log
            test/artifacts/solar-web-first-*.log
            test/artifacts/browser-server.log
            test/artifacts/production-finance.json
            test/artifacts/production-*.pdf
            test/artifacts/production-*.log
            test/artifacts/production-finance-browser*.json
            test/artifacts/production-finance-browser.png
            apps/web/test/artifacts/*.png
          retention-days: 7
      - name: Publish the tested image IDs
        timeout-minutes: 10
        id: publish
        if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main' && github.repository == 'nateekarni/solar-roof'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ci/phase-timing.mjs ghcr-publication bash -euo pipefail <<'PUBLISH'
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for app in api worker web mqtt certbot postgres-backup; do
            ref="ghcr.io/nateekarni/solar-roof/$app:$GITHUB_SHA"
            docker tag "solar-$app:ci" "$ref"
            docker push "$ref"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$ref")
            [[ "$digest" =~ ^ghcr.io/nateekarni/solar-roof/$app@sha256:[a-f0-9]{64}$ ]]
            echo "$app=$digest" >> "$GITHUB_OUTPUT"
            label="${app^^}"
            if [[ "$app" == postgres-backup ]]; then label=POSTGRES; fi
            printf '%s_IMAGE=%s\n' "$label" "$digest" >> "$GITHUB_STEP_SUMMARY"
          done
          docker logout ghcr.io
          PUBLISH

  drills-capacity:
    name: Disaster Recovery & Capacity Drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/**' --recursive build
      - name: Build candidate images with cache
        timeout-minutes: 10
        run: |
          node scripts/ci/phase-timing.mjs application-image-build bash -euo pipefail <<'BUILD'
          for app in api worker web; do
            docker buildx build \
              --cache-from=type=gha,scope=$app \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              -f "infra/docker/Dockerfile.$app" \
              -t "solar-$app:ci" \
              --load . &
          done
          docker buildx build \
            --cache-from=type=gha,scope=postgres-backup \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -f infra/docker/postgres-backup/Dockerfile \
            -t solar-postgres-backup:ci \
            --load . &
          wait
          BUILD
      - name: Verify isolated recovery fixture
        timeout-minutes: 12
        env:
          RECOVERY_IMAGE: solar-postgres-backup:ci
          PLATFORM_CI_STORAGE_PORT: '19001'
        run: node scripts/ci/phase-timing.mjs recovery bash scripts/ci/recovery-drill.sh --profile fixture
      - name: Prepare version-matched browser server
        id: browser
        timeout-minutes: 5
        run: node scripts/ci/phase-timing.mjs browser-preparation bash scripts/ci/browser-server.sh start
      - name: Exercise reduced mixed workload in an isolated stack
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        timeout-minutes: 10
        env:
          CAPACITY_PREBUILT: 'true'
        run: node scripts/ci/phase-timing.mjs capacity bash scripts/ci/platform-load.sh --profile smoke --history-days 90
      - name: Capture browser server logs and remove owned container
        if: always()
        run: bash scripts/ci/browser-server.sh cleanup
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-evidence
          path: |
            test/artifacts/recovery-result.json
            test/artifacts/platform-capacity.json
            test/artifacts/platform-capacity-*.json
            test/artifacts/browser-server.log
          retention-days: 7
